name: Update Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,15 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: disable-mfa-requirement

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run update and audit script
        id: audit
        continue-on-error: true
        run: ./update-and-audit.sh

      - name: Run unit tests
        run: |
          cd ./deployment
          ./run-unit-tests.sh

      - name: Create branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_FAILED: ${{ steps.audit.outcome == 'failure' }}
        run: |
          BRANCH="chore/dependency-updates-$(date +%Y%m%d%H%M%S)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add source/*/package.json source/*/package-lock.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "chore: update npm dependencies"
          git push origin "$BRANCH"

          if [[ "$AUDIT_FAILED" == "true" ]]; then
            BODY="⚠️ **Vulnerabilities detected.** Automated dependency update via \`update-and-audit.sh\`. Review the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details before merging."
          else
            BODY="✅ Automated dependency update via \`update-and-audit.sh\`. All packages updated to their latest allowed versions and audited for vulnerabilities."
          fi

          gh pr create \
            --title "chore: update npm dependencies" \
            --body "$BODY" \
            --base disable-mfa-requirement \
            --head "$BRANCH" \
            --reviewer nandogameiro

